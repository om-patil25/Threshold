services:
  db:
    image: postgres:18 #this is image for container to pull from docker hub
    restart: always #so it can restart automatically in case of crash
    environment: #environment variable are stored securely in .env file
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - 5432:5432 #this is the port on which postgres runs by default
    volumes:
      - ThresholdData:/var/lib/postgresql #this is location of volume in container for postgres version 18

volumes:
  ThresholdData:
