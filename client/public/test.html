<!DOCTYPE html>
<html>
<head>
<style>
  :root {
    --a: red;
    --b: var(--a);
  }
  .theme-dark {
    --a: blue;
  }
  .test {
    color: var(--b);
  }
</style>
</head>
<body>
  <div class="theme-dark">
    <div id="target" class="test">Hello World</div>
  </div>
  <script>
    const el = document.getElementById('target');
    const color = getComputedStyle(el).color;
    document.body.innerHTML += `<div id="result">${color}</div>`;
  </script>
</body>
</html>
